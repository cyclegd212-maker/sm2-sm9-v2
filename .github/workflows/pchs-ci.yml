name: pchs-ci

on:
  push:
    branches: [benchmark-liu2018-pchs, benchmark-gong2025-pki-clc, benchmark-hscmet2022-pki-clc]
  workflow_dispatch:

permissions:
  contents: read

env:
  GMSSL_COMMIT: 24ae482701a7b124826c382fffc55c19f76d475d

jobs:
  pchs-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout benchmark branch
        uses: actions/checkout@v4

      - name: Build and install pinned GmSSL
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/guanzhi/GmSSL.git _deps/GmSSL
          git -C _deps/GmSSL checkout "$GMSSL_COMMIT"
          test "$(git -C _deps/GmSSL rev-parse HEAD)" = "$GMSSL_COMMIT"
          cmake -S _deps/GmSSL -B _deps/GmSSL/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/_deps/gmssl-install" \
            -DENABLE_SM9=ON \
            -DENABLE_SM2_AMD64=OFF
          cmake --build _deps/GmSSL/build --config Release -j2
          cmake --install _deps/GmSSL/build

      - name: Configure native tree
        shell: bash
        run: |
          set -euo pipefail
          cmake -S native -B native/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DGMSSL_ROOT="$GITHUB_WORKSPACE/_deps/gmssl-install"

      - name: Build native tree
        shell: bash
        run: cmake --build native/build --config Release -j2

      - name: Run native tests
        shell: bash
        run: ctest --test-dir native/build --output-on-failure

      - name: Run statistics self-tests
        shell: bash
        run: |
          set -euo pipefail
          python scripts/summarize_pchs_liu2018.py --self-test
          python scripts/compare_v2_pchs.py --self-test
          if [ -f scripts/summarize_gong2025.py ]; then
            python scripts/summarize_gong2025.py --self-test
            python scripts/compare_v2_gong2025.py --self-test
          fi
          if [ -f scripts/summarize_hscmet2022.py ]; then
            python scripts/summarize_hscmet2022.py --self-test
            python scripts/compare_v2_hscmet2022.py --self-test
          fi

      - name: Parse Windows benchmark scripts
        shell: pwsh
        run: |
          $files = @("scripts/run_pchs_liu2018_windows.ps1")
          if (Test-Path "scripts/run_gong2025_windows.ps1") {
            $files += "scripts/run_gong2025_windows.ps1"
          }
          if (Test-Path "scripts/run_hscmet2022_windows.ps1") {
            $files += "scripts/run_hscmet2022_windows.ps1"
          }
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $file,
              [ref]$tokens,
              [ref]$errors)
            if ($errors.Count -ne 0) {
              $errors | ForEach-Object { Write-Error $_ }
              exit 1
            }
            Write-Host "$file PowerShell parser: ok"
          }
